[package]
name = "mediaplayerofdoom"
version = "3.2.41"
edition = "2021"

[dependencies]
eframe = "0.36"
libmkiso = { version = "0.1.5", default-features = false, features = ["native-writer"] }
anyhow = "1"
rodio = { version = "0.19", features = ["symphonia-all"] }
cpal = "0.15"
lofty = "0.22"
symphonia = "0.5"
hound = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rand = "0.9"
rfd = "0.14"
global-hotkey = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.24"
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

# Linux tray uses the pure-Rust StatusNotifierItem implementation so the app
# needs no GTK/libappindicator/libxdo at build or run time.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }
libc = "0.2"
sha1 = "0.10"

[build-dependencies]
embed-resource = "2"

[profile.release]
opt-level = 3
lto = true
strip = true